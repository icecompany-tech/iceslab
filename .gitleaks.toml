# gitleaks configuration.
#
# The first scan found thirteen "secrets", all of them test fixtures and CI
# placeholders. That is the normal starting state: the scanner judges a string
# by its entropy and cannot know whether it guards anything.
#
# The temptation is to silence it broadly. Resist that - a scanner that ignores
# whole directories will also ignore the real key someone pastes into one of
# them. Every entry below names WHAT is being allowed and WHY, so an addition is
# a decision rather than a side effect.
#
# A fixture lives NEXT TO its test. To the author that is one thing; to the
# scanner it is two, because an allowlist by path covers the test and not its
# data. That is the third time this has cost a red run: when a fixture trips the
# scanner, allow the VALUE, not the directory it happens to sit in.

[extend]
useDefault = true

[allowlist]
description = "Fixtures and placeholders that guard nothing"

paths = [
  # Test files. Credentials here exist so an assertion has something to compare
  # against; they are generated for the test and never reach a running system.
  '''.*\.test\.ts$''',
  '''.*_test\.go$''',
  # The test environment file, committed on purpose so the suite runs without
  # setup. Its values only ever address a throwaway local database.
  '''^\.env\.test$''',
]

regexes = [
  # CI placeholders. They are deliberately long enough to satisfy the config
  # validator's minimum length, which is exactly what makes them look like keys.
  '''ci-jwt-secret-must-be-at-least-32-chars-long''',
  '''ci-smoke-secret-must-be-at-least-32-chars''',
  # The literal name of the variable, matched where a workflow or example file
  # assigns an obvious dummy. Real values never live in the repository: they are
  # supplied through the environment on the host.
  '''JWT_SECRET:\s*ci-''',
  # The .env.test fixture value. Its whole purpose is to be recognised: the
  # panel refuses to boot outside NODE_ENV=test when JWT_SECRET equals it, so
  # nobody can ship the public fixture by accident. The scanner flagged the very
  # constant that exists to prevent the leak.
  #
  # Matched by VALUE rather than by file, so it stays silent wherever it appears
  # while a genuine key added to the same file is still caught. It also sits in
  # git history, where a fix cannot remove it.
  '''test_secret_at_least_32_characters_long_for_zod_validation''',
  # The fake REALITY key the cascade golden fixtures carry. Base64 of the
  # literal "hello-world-this-is-a-fake-key00", 43 characters: a real x25519 key
  # is exactly that long, and the fixture has to be key-shaped or it does not
  # exercise the code path it exists for.
  #
  # It ALREADY passes inside cascade_golden_test.go, which `paths` covers, and
  # fails one directory away in testdata/. Allowed by VALUE rather than by
  # adding testdata/ to `paths`: a cascade golden is precisely where somebody
  # will one day paste a real key, because the easiest way to capture a
  # reference config is to copy a live one, and an allowed directory would
  # swallow that without a word.
  '''aGVsbG8td29ybGQtdGhpcy1pcy1hLWZha2Uta2V5MDA''',
]
