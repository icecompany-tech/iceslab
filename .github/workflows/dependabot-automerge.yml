name: Dependabot auto-merge

# The owner's decision of 2026-09-26: a bot's pull request is not reviewed by
# hand. A minor or patch bump into develop is queued to merge ITSELF, and GitHub
# merges it only once the required checks on develop are green (CI's `gate`),
# so this workflow decides WHETHER to merge, never WHEN. A red PR stays open.
#
# What is left out on purpose:
#   - majors. dependabot.yml already ignores them for npm and gomod; the
#     actions group can still carry one, and fetch-metadata reports a group by
#     its largest bump, so such a group is left for a person;
#   - anything not opened by dependabot, and anything not aimed at develop.
#     A person's pull request goes through this file untouched.
#
# ⚠ Two things this relies on that are not in the repository:
#   - "Allow auto-merge" on in the repository settings (the owner turns it on);
#   - a required status check on develop. Without one, `--auto` has nothing to
#     wait for and merges at once, green or not.
#
# The merge is queued with a GitHub App's token, not GITHUB_TOKEN. A merge made
# with GITHUB_TOKEN starts no workflow of its own (GitHub's rule against
# recursive runs), so until 2026-10-22 the push to develop it made ran no CI
# and published no `develop` image, and the operator's test server waited for
# the next human push. Auto-merge is carried out as whoever queued it, so the
# App's token here is what makes the merged commit run CI like any push.
#
# The App (owner's settings, not this repository): installed on this
# repository only, with Contents, Pull requests and Workflows read/write.
# Workflows because the actions group edits files under .github/workflows,
# and GitHub refuses to merge those for an App without that permission. Its
# Client ID and private key are DEPENDABOT secrets, not Actions secrets: a
# workflow started by dependabot is given only the former.
#
# `workflow_dispatch` in ci.yml stays as the way to run CI by hand if this ever
# stops doing it.
#
# The switch: the repository variable DEPENDABOT_AUTOMERGE. Only `on` merges.
# It is off from the PR develop -> main until the branches held for after the
# release are in (27.10: two bot PRs landed in develop two minutes after the
# v0.3.0-rc.1 merge, and would have ridden into main had that PR still been
# open). `on`, not "anything but off": if a Dependabot run were ever given no
# variables, as it is given no Actions secrets, the switch fails shut instead
# of merging during a release.
#   gh variable set DEPENDABOT_AUTOMERGE --body off   (or on)

on:
  pull_request:
    branches: [develop]

# GITHUB_TOKEN only reads the metadata now; the merge goes through the App.
permissions:
  contents: read
  pull-requests: read

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && vars.DEPENDABOT_AUTOMERGE == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - id: app
        if: steps.meta.outputs.update-type == 'version-update:semver-minor' || steps.meta.outputs.update-type == 'version-update:semver-patch'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.AUTOMERGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
          # This repository and these three, whatever else the App is granted.
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Queue the merge for when the checks are green
        if: steps.app.outcome == 'success'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
