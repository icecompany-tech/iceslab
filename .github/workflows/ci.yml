name: CI

on:
  pull_request:
  push:
    # `develop` is the integration branch the operator work merges into and the
    # one their test server deploys from, so it has to be gated exactly like
    # main. Without it a merge into develop reached that server having passed
    # nothing but whatever the PR happened to run.
    branches: [main, develop]
    # ⚠ Release tags too. With `branches` alone a tag push starts nothing:
    # GitHub runs a push workflow only for the ref kinds it lists, so from
    # 2026-07-30 until this line no tag ran CI, the `docker` job's semver tags
    # (`:0.2.1`, `:0.2`, `:latest`) were never published, and release.yml,
    # which waits for this workflow to pass ON THE TAG, would have waited
    # forever.
    tags: ['v*']
  # By hand, from the Actions tab or `gh workflow run ci.yml --ref develop`.
  # A merge made with GITHUB_TOKEN (the dependabot auto-merge) starts no
  # workflow, so without this the merged tree had no push run and develop had
  # no image until the next human push. A manual run tests everything, like a
  # tag, and on main or develop it publishes, like a push.
  workflow_dispatch:

# Cancel in-flight runs when a new commit lands on the same ref. Saves
# minutes on rapid push-fix-push cycles and removes confusing red marks
# on superseded SHAs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────────────────────────
  # What this commit touched.
  #
  # Every job below that can be skipped asks this one, and none of them infers
  # it for itself: one filter, read in one place, so "why did the backend not
  # run" has a single answer on the run page.
  #
  # ⚠ A skipped job is GREEN in the checks list, and green is what branch
  # protection reads. That is why `gate` exists at the bottom and why it takes
  # these outputs: skipped-because-nothing-changed and skipped-because-a-
  # dependency-failed look identical from outside, and only one of them may
  # pass.
  # ───────────────────────────────────────────────────────────────────────
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A release tag and a manual run test everything. What a release ships is
    # the whole tree, not the diff of its last commit; and neither a tag push
    # nor a manual run has a `before` to compare with in the first place.
    outputs:
      backend: ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') || steps.filter.outputs.backend }}
      frontend: ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') || steps.filter.outputs.frontend }}
      node: ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') || steps.filter.outputs.node }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: "!startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch'"
        with:
          # The lockfile, the workspace file and THIS FILE are in every list: an
          # install affects all three apps whichever one the commit was about,
          # and a pipeline change that only runs on the next unrelated commit is
          # a pipeline change nobody tested.
          filters: |
            common: &common
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - '.nvmrc'
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'
            backend:
              - *common
              - 'apps/panel-backend/**'
              - 'packages/shared/**'
            frontend:
              - *common
              - 'apps/panel-frontend/**'
              - 'packages/shared/**'
            node:
              - *common
              - 'apps/node/**'
              - 'packages/shared/**'

      - name: Summary
        if: always()
        run: |
          {
            echo "### changes"
            echo ""
            echo "| area | runs |"
            echo "| --- | --- |"
            echo "| backend | ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') || steps.filter.outputs.backend }} |"
            echo "| frontend | ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') || steps.filter.outputs.frontend }} |"
            echo "| node-agent | ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') || steps.filter.outputs.node }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ───────────────────────────────────────────────────────────────────────
  # Dependency audit. Its own job on purpose: the lockfile is one per
  # workspace, so the audit belongs to neither app, and when it was the first
  # step of a combined panel job a fresh advisory hid whether typecheck and
  # tests passed at all (2026-09-09, fast-uri + mysql2). Now a red audit and a
  # red test suite are two different lights.
  # ───────────────────────────────────────────────────────────────────────
  audit:
    name: audit (deps, high+)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # ⚠ From .nvmrc, never a literal. The workflow and the backend image
          # drifted apart once (22.x against 22.22) and the image crash-looped on
          # a resolution difference the workflow could not see.
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Slice 35: npm audit gate. `--prod` ignores dev-only dependencies
      # (vitest / @types/*) which historically carry lower-stakes
      # transitive vulns we'd rather not gate releases on. `--audit-level
      # high` lets known-medium issues in third-party deps pass while
      # still failing the build on high/critical, where action is
      # expected within hours, not weeks. Tune as the fleet matures.
      #
      # Advisories deliberately silenced live in `pnpm.auditConfig.ignoreGhsas`
      # in the root package.json, and each one needs a reason recorded in the
      # commit that added it. Today that list holds exactly one:
      # GHSA-qwww-vcr4-c8h2 (react-router RSC-mode CSRF), whose fix only exists
      # in react-router 8.x. The panel is a Vite SPA and does not run React
      # Server Components at all, so the vulnerable code path is not reachable;
      # silencing it beats forcing a major frontend upgrade for a mode we do
      # not use. Revisit when the frontend moves to 8.x for other reasons.
      - name: pnpm audit (high+)
        run: pnpm audit --prod --audit-level high
        continue-on-error: false

  # ⚠ FOUR PARTS, each with its own Postgres and Redis. The suite runs its
  # files strictly one after another (`fileParallelism: false` in
  # vitest.config.ts: every file calls cleanDatabase() on the one test
  # database), so one job spent ~530 s on tests on one core while three sat
  # idle. Split by `vitest --shard`, the same 202 files take ~140 s a part
  # (simulated on the per-file times of run 39718422205; N=6 gained nothing,
  # one part collects the heaviest files). A database shared between parts
  # is exactly the collision the serial run exists to avoid, so each part
  # gets its own service containers, which a matrix gives for free.
  #
  # `backend-files` below adds the parts up: a file that no part ran would
  # otherwise be a green tick over a test that never happened.
  backend:
    name: backend (panel, ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    strategy:
      # One red part must not cancel the others: the point of the run page is
      # to show every failing file at once.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    # Real Postgres + Redis. The backend's vitest suite mostly mocks Prisma
    # but `subscription.routes.test.ts` and a handful of others import the
    # real client, which fails fast without a reachable DATABASE_URL. Same
    # logic for BullMQ which mounts on Redis at import time.
    services:
      postgres:
        # I8 - match prod (postgres:16-alpine). Debian `postgres:16` and the
        # alpine image occasionally differ in collation / default settings;
        # testing on the same image we ship removes that drift.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ice
          POSTGRES_PASSWORD: ice
          POSTGRES_DB: iceslab_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ice"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://ice:ice@localhost:5432/iceslab_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-jwt-secret-must-be-at-least-32-chars-long
      PUBLIC_URL: https://panel.ci.test
      NODE_ENV: test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # ⚠ From .nvmrc, never a literal. The workflow and the backend image
          # drifted apart once (22.x against 22.22) and the image crash-looped on
          # a resolution difference the workflow could not see.
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prisma generate + migrate
        working-directory: apps/panel-backend
        run: |
          pnpm exec prisma generate
          pnpm exec prisma migrate deploy

      # An xray binary so the cascade suite can ask the CORE whether the config
      # we generate actually loads. Every other cascade test checks structure
      # and none can answer that; on 2026-08-08 the gap cost both cascade
      # entries (vlessRoute went out as an array, xray rejected the whole file,
      # cores sat in a crash loop) while 88 green tests said nothing. See
      # BACKLOG E10. Without XRAY_BIN those tests skip themselves, so this step
      # is what turns them on.
      #
      # Pinned, not "latest": a moving core version would make CI fail for
      # reasons unrelated to the commit under test. Bump deliberately.
      #
      # ⚠ RETRIED, and retries live on the two downloads and nowhere else. A
      # GitHub release download is the one step here that fails for reasons
      # having nothing to do with the commit. A retry around a TEST would hide
      # the races we spend our time hunting, so the suites get none.
      - name: Install xray (for config-validity tests)
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if curl -fsSL --retry 2 --retry-delay 3 -o /tmp/xray.zip \
              https://github.com/XTLS/Xray-core/releases/download/v26.3.27/Xray-linux-64.zip
            then break; fi
            echo "xray download failed (attempt ${attempt}/3)"
            [ "$attempt" = 3 ] && exit 1
            sleep $(( attempt * 5 ))
          done
          # The manifest's sha256 (packages/shared/src/core-versions.ts);
          # core-pins.test.ts holds this line and the URL to it.
          echo "23cd9af937744d97776ee35ecad4972cf4b2109d1e0fe6be9930467608f7c8ae  /tmp/xray.zip" | sha256sum -c -
          # The two .dat files from the same archive: xray looks for them next
          # to its binary, and a rule naming geosite:/geoip: cannot be judged
          # without them (the own-preset xray -test skips itself then).
          unzip -o /tmp/xray.zip xray geosite.dat geoip.dat -d /tmp/xray-bin
          chmod +x /tmp/xray-bin/xray
          echo "XRAY_BIN=/tmp/xray-bin/xray" >> "$GITHUB_ENV"
          /tmp/xray-bin/xray version | sed -n 1p

      # A sing-box binary, for the same reason and with the same shape as xray
      # above: phase 4 moves the chain into a sing-box process whose config the
      # PANEL renders, and structure tests cannot answer the only question that
      # matters on a node, will the engine start. `sing-box check` can.
      #
      # Same release, tarball and sha256 the node installs (the version
      # manifest), so CI validates against the build the fleet actually runs
      # rather than against a newer parser. core-pins.test.ts holds them equal.
      #
      # Without SINGBOX_BIN those tests skip themselves, exactly like the xray
      # ones, so a laptop with no sing-box still runs the suite.
      - name: Install sing-box (for chain config-validity tests)
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if curl -fsSL --retry 2 --retry-delay 3 -o /tmp/sing-box.tar.gz \
              https://github.com/icecompany-tech/core-builds/releases/download/core-singbox-v1.13.14/sing-box-1.13.14-iceslab-linux-amd64.tar.gz
            then break; fi
            echo "sing-box download failed (attempt ${attempt}/3)"
            [ "$attempt" = 3 ] && exit 1
            sleep $(( attempt * 5 ))
          done
          echo "8c982dfa05d5d2bf508a3e282fa3cceb22b0d6e7993b845f4e82df32660ae19e  /tmp/sing-box.tar.gz" | sha256sum -c -
          tar -xzf /tmp/sing-box.tar.gz -C /tmp
          mkdir -p /tmp/sing-box-bin
          install -m 0755 /tmp/sing-box-1.13.14-iceslab-linux-amd64/sing-box /tmp/sing-box-bin/sing-box
          echo "SINGBOX_BIN=/tmp/sing-box-bin/sing-box" >> "$GITHUB_ENV"
          # Our build (core-builds): the official tags plus with_v2ray_api. A
          # binary without it would let a config with v2ray_api pass nowhere.
          ver=$(/tmp/sing-box-bin/sing-box version)
          head -1 <<<"$ver"
          case "$ver" in *with_v2ray_api*) ;; *) echo "::error::sing-box without with_v2ray_api"; exit 1 ;; esac

      # E30a: hysteria-pin.live.test.ts runs native hysteria on the pair the
      # PANEL mints and dials it with hysteria's own client, sing-box and xray,
      # each pinning it the way its subscription format says. Same release and
      # sha256 as the agent job's step below. Without HYSTERIA_BIN the test
      # skips itself.
      - name: Install hysteria (for the pinned self-signed certificate test)
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if curl -fsSL --retry 2 --retry-delay 3 -o /tmp/hysteria \
              https://github.com/apernet/hysteria/releases/download/app%2Fv2.12.3/hysteria-linux-amd64
            then break; fi
            echo "hysteria download failed (attempt ${attempt}/3)"
            [ "$attempt" = 3 ] && exit 1
            sleep $(( attempt * 5 ))
          done
          echo "8c7a68a906998b747a0db87586e364f995fbfddb95693ae6e2fdb68a6e920d3e  /tmp/hysteria" | sha256sum -c -
          chmod +x /tmp/hysteria
          echo "HYSTERIA_BIN=/tmp/hysteria" >> "$GITHUB_ENV"
          /tmp/hysteria version | grep '^Version:'

      # Phase 9: the panel converts v2fly geo lists into the chain's rule-sets
      # itself, and geo-dat.test.ts compares that, key by key, with sing-box's
      # own export of a sing-geosite release built from the SAME dlc.dat.
      #
      # ⚠ Not the product pin (GEO_BUILTIN in packages/shared/src/geo.ts).
      # sing-geosite keeps only its recent releases: on 2026-10-22 the one
      # matching the pin, 20260922112956, answered 404 and develop went red
      # from 3dee885 for a reason no commit had touched. The test checks the
      # CONVERTER, so any pair works as long as both files come from one dlc
      # release: the freshest sing-geosite tag that v2fly also has a release
      # for. The tag reaches the test as GEO_COMPARE_TAG, and with it set the
      # test fails rather than skips when a file is missing.
      - name: Pick the geo release pair (for the conversion test)
        id: geo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tags=""
          for attempt in 1 2 3; do
            if tags=$(gh api 'repos/SagerNet/sing-geosite/releases?per_page=20' --jq '.[].tag_name'); then break; fi
            echo "sing-geosite release list failed (attempt ${attempt}/3)"
            [ "$attempt" = 3 ] && exit 1
            sleep $(( attempt * 5 ))
          done
          tag=""
          for t in $tags; do
            if gh api "repos/v2fly/domain-list-community/releases/tags/$t" --silent 2>/dev/null; then
              tag="$t"
              break
            fi
          done
          if [ -z "$tag" ]; then
            echo "::error::none of the last 20 sing-geosite releases has a domain-list-community release of the same tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "GEO_COMPARE_TAG=$tag" >> "$GITHUB_ENV"

      # By tag: a run downloads only when upstream publishes a newer pair.
      - name: Cache the geo release pair
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/geo
          key: geo-pair-${{ steps.geo.outputs.tag }}

      # No sha256 of ours to hold them to (the pair moves by design), so each
      # file is checked against the .sha256sum its own release publishes.
      - name: Fetch the geo release pair
        env:
          TAG: ${{ steps.geo.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/geo
          cd /tmp/geo
          fetch() {
            local base="$1" file="$2"
            if [ -f "$file" ] && [ -f "$file.sha256sum" ] && sha256sum -c "$file.sha256sum" >/dev/null 2>&1; then
              return 0
            fi
            for attempt in 1 2 3; do
              if curl -fsSL --retry 2 --retry-delay 3 -o "$file" "$base/$file" &&
                 curl -fsSL --retry 2 --retry-delay 3 -o "$file.sha256sum" "$base/$file.sha256sum"
              then break; fi
              echo "download failed: $base/$file (attempt ${attempt}/3)"
              [ "$attempt" = 3 ] && exit 1
              sleep $(( attempt * 5 ))
            done
            sha256sum -c "$file.sha256sum"
          }
          fetch "https://github.com/v2fly/domain-list-community/releases/download/$TAG" dlc.dat
          fetch "https://github.com/SagerNet/sing-geosite/releases/download/$TAG" geosite.db
          echo "GEO_DLC_DAT=/tmp/geo/dlc.dat" >> "$GITHUB_ENV"
          echo "SING_GEOSITE_DB=/tmp/geo/geosite.db" >> "$GITHUB_ENV"

      # Once, in the first part: the types are the same in all four.
      - name: Typecheck backend
        if: matrix.shard == 1
        working-directory: apps/panel-backend
        run: pnpm exec tsc --noEmit

      # `github-actions` puts a failing assertion on the diff as an annotation,
      # so a red suite is readable without opening the log; `json` is what the
      # summary below counts and what `backend-files` adds up. The default
      # reporter stays, because the log is still where a human looks when the
      # annotation is not enough.
      - name: Test backend (part ${{ matrix.shard }} of 4)
        working-directory: apps/panel-backend
        run: >-
          pnpm exec vitest run --passWithNoTests --shard=${{ matrix.shard }}/4
          --reporter=default --reporter=github-actions
          --reporter=json --outputFile=/tmp/backend-vitest-${{ matrix.shard }}.json

      # The report even from a red part: a part that failed still ran its files,
      # and the count is about which files ran, not whether they passed.
      - name: Keep the report for the file count
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-vitest-${{ matrix.shard }}
          path: /tmp/backend-vitest-${{ matrix.shard }}.json
          if-no-files-found: ignore
          retention-days: 3

      - name: Summary
        if: always()
        run: |
          {
            echo "### backend (panel), part ${{ matrix.shard }} of 4"
            echo ""
            report=/tmp/backend-vitest-${{ matrix.shard }}.json
            if [ -f "$report" ]; then
              jq -r '"- tests: \(.numPassedTests) passed, \(.numPendingTests) skipped, " +
                     "\(.numFailedTests) failed, over \(.testResults | length) files"' "$report"
              jq -r '"- this part ran in \(((.testResults | map(.endTime - .startTime) | add // 0) / 1000 | floor))s"' "$report"
            else
              echo "- tests: no report, so the part did not get as far as running"
            fi
            echo "- config validity asked of the pinned engines: xray v26.3.27, sing-box v1.13.14 (our build with v2ray_api, core-singbox-v1.13.14)"
            echo "- geo rule-sets compared on the release pair ${{ steps.geo.outputs.tag || '-' }} (dlc.dat and sing-geosite of one tag)"
          } >> "$GITHUB_STEP_SUMMARY"

  # ───────────────────────────────────────────────────────────────────────
  # The four backend parts, added up. Each part is green about ITS files, and
  # nothing in a part knows whether another part ran at all: a shard that
  # came out empty, or a file that fell between two, would leave four green
  # ticks over tests nobody ran. So the files every part reports are counted
  # against the test files in the tree, and a difference fails this job. The
  # tree is counted with the include globs of vitest.config.ts.
  # ───────────────────────────────────────────────────────────────────────
  backend-files:
    name: backend (all parts, file count)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, backend]
    if: "!cancelled() && needs.changes.outputs.backend == 'true'"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: backend-vitest-*
          path: /tmp/reports
          merge-multiple: true

      - name: Every test file ran in exactly one part
        run: |
          set -euo pipefail
          cd apps/panel-backend
          # vitest.config.ts: include ['src/**/*.test.ts', 'tests/**/*.test.ts'].
          tree=$( { find src tests -name '*.test.ts' -type f 2>/dev/null || true; } | sed 's#^#/#' | sort)
          expected=$(printf '%s\n' "$tree" | grep -c . || true)
          ran=$(jq -r '.testResults[].name' /tmp/reports/backend-vitest-*.json 2>/dev/null \
            | sed 's#^.*/apps/panel-backend##' | sort)
          got=$(printf '%s\n' "$ran" | grep -c . || true)
          dup=$(printf '%s\n' "$ran" | uniq -d)
          missing=$(comm -23 <(printf '%s\n' "$tree") <(printf '%s\n' "$ran" | sort -u))
          parts=$(ls /tmp/reports/backend-vitest-*.json 2>/dev/null | wc -l)
          {
            echo "### backend (all parts)"
            echo ""
            echo "- reports from parts: ${parts} of 4"
            echo "- test files in the tree: ${expected}, run across the parts: ${got}"
          } >> "$GITHUB_STEP_SUMMARY"
          verdict=0
          if [ "$parts" != 4 ]; then
            echo "::error::only ${parts} of 4 backend parts left a report"
            verdict=1
          fi
          if [ -n "$missing" ]; then
            echo "::error::test files no part ran: $(echo $missing)"
            verdict=1
          fi
          if [ -n "$dup" ]; then
            echo "::error::test files run by more than one part: $(echo $dup)"
            verdict=1
          fi
          if [ "$got" != "$expected" ]; then
            echo "::error::${got} files ran, the tree has ${expected}"
            verdict=1
          fi

          # A-191, the backend side. Its engine tests skip with
          # it.skipIf(!XRAY_BIN) and print no reason, so the guard is a list:
          # a skipped test that is not on it fails the job. CI installs every
          # engine and sets GEO_COMPARE_TAG, so the only skip expected here is
          # the placeholder geo-dat.test.ts prints when that tag is SET. A new
          # skip that is meant goes on this list in the commit that adds it.
          allowed='oracle tag not set'
          skipped=$(jq -r '.testResults[].assertionResults[]
                           | select(.status == "skipped" or .status == "pending")
                           | .fullName' /tmp/reports/backend-vitest-*.json | sort -u)
          unexpected=$(printf '%s\n' "$skipped" | grep -v -e '^$' -e "$allowed" || true)
          echo "- skipped tests: $(printf '%s\n' "$skipped" | grep -c . || true), outside the allowed list: $(printf '%s\n' "$unexpected" | grep -c . || true)" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$unexpected" ]; then
            echo "::error::tests skipped in CI that are not on the allowed list (an engine binary missing?):"
            printf '%s\n' "$unexpected"
            verdict=1
          fi
          exit "$verdict"

  # No Postgres, no Redis, no Prisma: the SPA never touches them. Its own job
  # so a backend test failure and a frontend type error stop sharing one red
  # mark, and so the frontend result arrives in about a minute instead of
  # waiting behind the backend suite.
  frontend:
    name: frontend (panel)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # ⚠ From .nvmrc, never a literal. The workflow and the backend image
          # drifted apart once (22.x against 22.22) and the image crash-looped on
          # a resolution difference the workflow could not see.
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `tsc -b`, not `tsc --noEmit`. The frontend references @iceslab/shared as
      # a composite project; --noEmit skips building referenced projects and so
      # typechecks against whatever .d.ts happens to be on disk, which in CI is
      # a fresh checkout with none. Errors that only the Docker build caught
      # were slipping through this step for exactly that reason.
      - name: Typecheck frontend
        working-directory: apps/panel-frontend
        run: pnpm exec tsc -b

      # The debt this step used to carry is zero as of 2026-09-21, so the step
      # can finally fail the build instead of printing a wall nobody reads.
      #
      # The lint step below hands its exit code to a script, so that script is
      # the thing that can silently turn a job green over live violations. Six
      # assertions on its exit code, run before it is trusted, with node's own
      # test runner and no dependency.
      - name: Test the lint reporter
        run: node --test .github/scripts/eslint-annotations.test.mjs

      # Violations land as annotations ON THE LINE in the PR. The `unix`
      # formatter every problem-matcher recipe names was removed from core
      # ESLint 9, and a SARIF formatter is a dependency for the same result, so
      # the built-in json report is turned into annotations by a script.
      #
      # `|| true` because the script decides the outcome: letting eslint fail
      # the step here would kill the job before a single annotation is printed.
      - name: Lint frontend
        working-directory: apps/panel-frontend
        run: |
          pnpm exec eslint . -f json -o eslint-report.json || true
          node "$GITHUB_WORKSPACE/.github/scripts/eslint-annotations.mjs" eslint-report.json

      # Before the build, not after: a broken assertion is cheaper to read on
      # its own than inside a bundle log.
      - name: Test frontend
        working-directory: apps/panel-frontend
        run: pnpm exec vitest run

      # The same build the frontend Dockerfile runs, ten seconds here instead
      # of a failed image job after the merge.
      - name: Build frontend
        working-directory: apps/panel-frontend
        run: pnpm exec vite build

      # Three numbers on the run page, so a regression is seen without opening
      # the log. The bundle size is the one that pays for itself: a dead modal
      # carried 29 KB of the Nodes chunk for weeks and nothing said so.
      #
      # `if: always()` on purpose: the summary is most useful on the run where
      # something failed. Each number is guarded, because a step that dies
      # trying to report a failure hides the failure it was reporting.
      - name: Summary
        if: always()
        working-directory: apps/panel-frontend
        run: |
          {
            echo "### frontend (panel)"
            if [ -f vitest-report.json ]; then
              node -e '
                const r = require("./vitest-report.json");
                const t = r.numTotalTests ?? 0, p = r.numPassedTests ?? 0, f = r.numFailedTests ?? 0;
                console.log(`- tests: ${p}/${t} passed` + (f ? `, ${f} failed` : ""));
              '
            else
              echo "- tests: no report (the step did not get that far)"
            fi
            if [ -f eslint-report.json ]; then
              node -e '
                const r = require("./eslint-report.json");
                const e = r.reduce((n, f) => n + f.errorCount, 0);
                const w = r.reduce((n, f) => n + f.warningCount, 0);
                console.log(`- lint: ${e} errors, ${w} warnings`);
              '
            else
              echo "- lint: no report (the step did not get that far)"
            fi
            if [ -d dist ]; then
              echo "- dist: $(du -sk dist | cut -f1) KB, js $(du -ck dist/assets/*.js 2>/dev/null | tail -1 | cut -f1) KB"
            else
              echo "- dist: not built"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  node-agent:
    name: node-agent (Go)
    runs-on: ubuntu-latest
    # 20, not 10: a cold caddy-naive build takes minutes (cached after).
    timeout-minutes: 20
    needs: [changes]
    if: needs.changes.outputs.node == 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The `toolchain` of apps/node/go.mod, exactly; one Go everywhere the
          # agent is built (bootstrap_checks_test.go holds them together).
          go-version: '1.27.3'
          # No go.sum yet (zero external deps), let setup-go skip cache wiring.
          cache: false

      - name: Build
        working-directory: apps/node
        run: go build ./...

      - name: Vet
        working-directory: apps/node
        run: go vet ./...

      # A hysteria binary, for the engine-verdict tests in core/hysteria (phase
      # 6). The AGENT renders the hysteria config, so the question "will the
      # engine load this" belongs to this job and not to the backend's, where the
      # xray and sing-box binaries are installed for the configs the PANEL
      # renders.
      #
      # hysteria has no `check`, so the tests START it and read the log for
      # "server up and running" or FATAL. Same release and sha256 both installers
      # pin (the version manifest); core-pins.test.ts holds this line to it, so
      # the three cannot drift apart. Without
      # HYSTERIA_BIN those tests skip themselves, so a laptop still runs the rest.
      - name: Install hysteria (for config-validity tests)
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if curl -fsSL --retry 2 --retry-delay 3 -o /tmp/hysteria \
              https://github.com/apernet/hysteria/releases/download/app%2Fv2.12.3/hysteria-linux-amd64
            then break; fi
            echo "hysteria download failed (attempt ${attempt}/3)"
            [ "$attempt" = 3 ] && exit 1
            sleep $(( attempt * 5 ))
          done
          echo "8c7a68a906998b747a0db87586e364f995fbfddb95693ae6e2fdb68a6e920d3e  /tmp/hysteria" | sha256sum -c -
          chmod +x /tmp/hysteria
          echo "HYSTERIA_BIN=/tmp/hysteria" >> "$GITHUB_ENV"
          /tmp/hysteria version | grep '^Version:'

      # ⚠ xray and sing-box here too, not only in the backend job. Until
      # 2026-10-22 this job installed hysteria alone, so every agent test that
      # asks xray or sing-box (the live REALITY client of A-129, `xray -test`,
      # `sing-box check`, the direct-resolver live tests) skipped itself on
      # XRAY_BIN / SINGBOX_BIN unset, and a green node-agent said nothing about
      # them. Same releases and sha256 as the backend job's steps, which
      # core-pins.test.ts holds to the version manifest; retried on the
      # download only, as there.
      - name: Install xray (for the agent's engine tests)
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if curl -fsSL --retry 2 --retry-delay 3 -o /tmp/xray.zip \
              https://github.com/XTLS/Xray-core/releases/download/v26.3.27/Xray-linux-64.zip
            then break; fi
            echo "xray download failed (attempt ${attempt}/3)"
            [ "$attempt" = 3 ] && exit 1
            sleep $(( attempt * 5 ))
          done
          echo "23cd9af937744d97776ee35ecad4972cf4b2109d1e0fe6be9930467608f7c8ae  /tmp/xray.zip" | sha256sum -c -
          unzip -o /tmp/xray.zip xray -d /tmp/xray-bin
          chmod +x /tmp/xray-bin/xray
          echo "XRAY_BIN=/tmp/xray-bin/xray" >> "$GITHUB_ENV"
          /tmp/xray-bin/xray version | sed -n 1p

      - name: Install sing-box (for the agent's engine tests)
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if curl -fsSL --retry 2 --retry-delay 3 -o /tmp/sing-box.tar.gz \
              https://github.com/icecompany-tech/core-builds/releases/download/core-singbox-v1.13.14/sing-box-1.13.14-iceslab-linux-amd64.tar.gz
            then break; fi
            echo "sing-box download failed (attempt ${attempt}/3)"
            [ "$attempt" = 3 ] && exit 1
            sleep $(( attempt * 5 ))
          done
          echo "8c982dfa05d5d2bf508a3e282fa3cceb22b0d6e7993b845f4e82df32660ae19e  /tmp/sing-box.tar.gz" | sha256sum -c -
          tar -xzf /tmp/sing-box.tar.gz -C /tmp
          mkdir -p /tmp/sing-box-bin
          install -m 0755 /tmp/sing-box-1.13.14-iceslab-linux-amd64/sing-box /tmp/sing-box-bin/sing-box
          echo "SINGBOX_BIN=/tmp/sing-box-bin/sing-box" >> "$GITHUB_ENV"
          # Our build (core-builds): the official tags plus with_v2ray_api. A
          # binary without it would let a config with v2ray_api pass nowhere.
          ver=$(/tmp/sing-box-bin/sing-box version)
          head -1 <<<"$ver"
          case "$ver" in *with_v2ray_api*) ;; *) echo "::error::sing-box without with_v2ray_api"; exit 1 ;; esac

      # mita for the mieru adapter's live test (A-275: an inbound with no users
      # waits, the first user brings mita up). Upstream ships mita only as a
      # .deb, so the binary is taken out of it with dpkg-deb -x: nothing is
      # installed and no mita.service starts on the runner. Same release and
      # sha256 bootstrap-mieru.sh pins (the version manifest), which
      # core-pins.test.ts holds this line to.
      - name: Install mita (for the mieru adapter's live test)
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if curl -fsSL --retry 2 --retry-delay 3 -o /tmp/mita.deb \
              https://github.com/enfein/mieru/releases/download/v3.37.0/mita_3.37.0_amd64.deb
            then break; fi
            echo "mita download failed (attempt ${attempt}/3)"
            [ "$attempt" = 3 ] && exit 1
            sleep $(( attempt * 5 ))
          done
          echo "22248dc1568280a8b1bdaf55051a59b3d64ac1edb4ec4918e3925088f78a35de  /tmp/mita.deb" | sha256sum -c -
          dpkg-deb -x /tmp/mita.deb /tmp/mita-deb
          install -D -m 0755 /tmp/mita-deb/usr/bin/mita /tmp/mita-bin/mita
          echo "MIERU_BIN=/tmp/mita-bin/mita" >> "$GITHUB_ENV"
          /tmp/mita-bin/mita version

      # caddy-naive for the naive adapter's live test (A-118, admin API on a
      # unix socket). The same pinned set bootstrap-naive.sh builds on a node
      # (A-216: xcaddy, Caddy and the klzgrad/forwardproxy commit, never a
      # branch or latest); bootstrap_checks_test.go holds the two to each
      # other. A build takes minutes, so it is cached under the set and the Go
      # that built it, and checked for forward_proxy either way.
      - name: Cache caddy-naive (pinned set)
        id: caddy-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/caddy-naive-bin
          key: caddy-naive-xcaddy-v0.4.7-caddy-v2.11.7-forwardproxy-v0.0.0-20261006113151-c096d6a00cb2-go1.27.3

      - name: Build caddy-naive (for the naive adapter's live test)
        env:
          XCADDY_VERSION: v0.4.7
          CADDY_VERSION: v2.11.7
          FORWARDPROXY_VERSION: v0.0.0-20261006113151-c096d6a00cb2
          CACHE_HIT: ${{ steps.caddy-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          bin=/tmp/caddy-naive-bin/caddy-naive
          if [ "$CACHE_HIT" != true ] || [ ! -x "$bin" ]; then
            GOBIN=/tmp/xcaddy-bin go install "github.com/caddyserver/xcaddy/cmd/xcaddy@${XCADDY_VERSION}"
            mkdir -p /tmp/caddy-naive-bin
            ( cd "$(mktemp -d)" &&
              XCADDY_GO_BUILD_FLAGS="-trimpath -ldflags='-s -w'" \
              /tmp/xcaddy-bin/xcaddy build "$CADDY_VERSION" \
                --with "github.com/caddyserver/forwardproxy@caddy2=github.com/klzgrad/forwardproxy@${FORWARDPROXY_VERSION}" \
                --output "$bin" )
          fi
          "$bin" version
          mods=$("$bin" list-modules 2>&1)
          grep -Eq '^[[:space:]]*http\.handlers\.forward_proxy[[:space:]]*$' <<<"$mods" ||
            { echo "::error::caddy-naive has no forward_proxy module"; exit 1; }
          echo "CADDY_NAIVE_BIN=$bin" >> "$GITHUB_ENV"

      # -json, so the summary can say which tests SKIPPED and why: `ok` on a
      # package says nothing about a test inside it that skipped itself. The
      # log still shows a readable line per package and every failure in full.
      - name: Test
        working-directory: apps/node
        run: |
          set -o pipefail
          status=0
          go test -json ./... > /tmp/go-test.json || status=$?
          jq -r 'select(.Action == "output" and .Test == null) | .Output' /tmp/go-test.json | grep -E '^(ok|FAIL|---|\?)' || true
          if [ "$status" != 0 ]; then
            echo "== failing tests, full output:"
            jq -r 'select(.Action == "fail" and .Test != null) | "\(.Package) \(.Test)"' /tmp/go-test.json | sort -u |
              while read -r pkg test; do
                jq -r --arg p "$pkg" --arg t "$test" \
                  'select(.Package == $p and .Test == $t and .Action == "output") | .Output' /tmp/go-test.json
              done
          fi
          exit "$status"

      # A-191. An engine test skips itself when its binary is missing, which is
      # right on a laptop and wrong here: in CI it turns a removed install step
      # into green. The agent's tests say so in one shape,
      # t.Skip("XRAY_BIN not set...") / t.Skip("HYSTERIA_BIN not set"), so any
      # skip line of that shape fails the job, whatever the tests themselves
      # concluded.
      - name: No engine test skipped for want of its binary
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          [ -f /tmp/go-test.json ] || { echo "no test report, nothing to check"; exit 0; }
          missing=$(jq -r 'select(.Test != null and .Action == "output" and (.Output | test("[A-Z]+_BIN not set")))
                           | "\(.Package | sub(".*/apps/node/"; "")) \(.Test): \(.Output | sub("^\\s+"; "") | rtrimstr("\n"))"' \
                      /tmp/go-test.json)
          if [ -n "$missing" ]; then
            echo "::error::engine tests skipped because a binary was not set; CI installs every engine, so this is a missing step, not a pass"
            printf '%s\n' "$missing"
            exit 1
          fi
          echo "no engine test skipped for want of its binary"

      - name: Summary
        if: always()
        run: |
          {
            echo "### node-agent (Go)"
            echo ""
            if [ -f /tmp/go-test.json ]; then
              count() { jq -r --arg a "$1" 'select(.Action == $a and .Test != null) | .Test' /tmp/go-test.json | wc -l; }
              echo "- tests: $(count pass) passed, $(count skip) skipped, $(count fail) failed"
              echo ""
              echo "<details><summary>skipped, with the reason each gave</summary>"
              echo ""
              # The reason is the last line the test printed before its skip,
              # not counting go test's own === RUN / --- SKIP lines.
              jq -r 'select(.Test != null and (.Action == "output" or .Action == "skip"))
                     | [.Action, .Package, .Test, (.Output // "")] | @tsv' /tmp/go-test.json |
                awk -F'\t' '$1 == "output" && $4 !~ /^ *(=== |--- )/ { last[$2" "$3] = $4 }
                            $1 == "skip" { r = last[$2" "$3]; gsub(/^ +| +$|\\n/, "", r);
                                           sub(/.*github.com\/icecompany-tech\/iceslab\/apps\/node\//, "", $2);
                                           print "- `" $2 "` " $3 ": " r }'
              echo ""
              echo "</details>"
            else
              echo "- the suite produced no output, so it did not get as far as running"
            fi
            echo "- engines asked: hysteria v2.12.3, xray v26.3.27, sing-box v1.13.14 (our build with v2ray_api), caddy-naive (caddy v2.11.7 + forwardproxy c096d6a00cb2)"
          } >> "$GITHUB_STEP_SUMMARY"

  # Slice 36 follow-up: build + publish container images to GHCR on every
  # push to main or develop and on every tag. Pull requests build but don't
  # publish (no creds reach forked-PR jobs). Tag naming follows GHCR convention:
  #   ghcr.io/icecompany-tech/iceslab-backend:main         (rolling)
  #   ghcr.io/icecompany-tech/iceslab-backend:develop      (rolling, test server)
  #   ghcr.io/icecompany-tech/iceslab-backend:sha-<7c>     (every push)
  #   ghcr.io/icecompany-tech/iceslab-backend:1.2.3        (only on `v*` tags, no `v`)
  # develop publishes because the operator's test server pulls from it; the
  # `develop` tag is what makes "merged into develop" and "deployable to test"
  # the same event instead of a manual rebuild on the box.
  # The three Dockerfiles already exist (panel-backend / panel-frontend /
  # node-agent), this job just wraps them.
  docker:
    name: docker (build + publish)
    runs-on: ubuntu-latest
    # ⚠ EVERY check, not the three that happen to be about code. Until
    # 2026-09-22 this waited on audit/backend/frontend/node-agent only, so a RED
    # SECRETS SCAN still published `develop` to GHCR and the operator's test
    # server pulled it. A pipeline that ships past its own alarm is not a
    # pipeline. go-lint is in the list for the same reason while it is still
    # report-only: the day it starts failing is the day it must stop a publish.
    needs: [changes, audit, backend, backend-files, frontend, node-agent, secrets-scan, go-lint]
    # Runs on a pull request too, but only BUILDS there (see `push:` below).
    # A Dockerfile break used to surface after merge, when the job first ran on
    # develop - which is also the branch the operator's test server pulls from,
    # so the first sign of trouble was a deploy that had nothing to deploy.
    # Building on the PR moves that discovery before the merge; publishing stays
    # restricted, because an image from an unmerged branch has nowhere to go.
    # ⚠ Same-repo pull requests only. `docker build` executes whatever the
    # Dockerfile says, so building an arbitrary fork's PR would run a stranger's
    # code on our runner. The repo is public and fork PRs are routine here, so
    # that is not theoretical. A fork PR still gets the panel and node-agent
    # checks; only the image build is withheld.
    #
    # The first two clauses are what a path filter costs: a job whose `needs`
    # were skipped is itself skipped unless it says otherwise, and an image has
    # to exist for every commit whether or not this one touched the backend. So
    # the condition asks about FAILURE rather than about success.
    if: >-
      !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
       (github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' ||
         github.ref == 'refs/heads/develop' ||
         startsWith(github.ref, 'refs/tags/v'))) ||
       (github.event_name == 'workflow_dispatch' &&
        (github.ref == 'refs/heads/main' ||
         github.ref == 'refs/heads/develop')))
    permissions:
      contents: read
      packages: write
    env:
      # build-push-action uploads a build record artifact per image on every
      # run (~60 KB each, three images). They are only useful for opening a
      # build in Docker Desktop, which nobody here does, and they accumulate
      # against the storage quota. The build summary in the job page stays.
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    strategy:
      matrix:
        image:
          - name: iceslab-backend
            context: .
            dockerfile: apps/panel-backend/Dockerfile
          - name: iceslab-frontend
            context: .
            dockerfile: apps/panel-frontend/Dockerfile
          - name: iceslab-node
            context: apps/node
            dockerfile: apps/node/Dockerfile

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The runtime the images are built on comes from the same file the
      # workflow's own Node comes from. The Dockerfiles keep a default so a
      # plain `docker build` off a checkout still works.
      - name: Node version from .nvmrc
        id: node
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      # The version the node agent reports (A-202), the same rule as the
      # installer: the release tag on a tag, else the short commit. Only the
      # agent's Dockerfile reads it; the other two ignore the build arg.
      - name: Agent version
        id: agent
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" == tag && "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "version=$REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      # Only needed to publish. Skipped on a pull request, where the job builds
      # and throws the image away - a fork PR has no write token anyway, so
      # attempting the login there would fail the job for no reason.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # What a tag gets, read from metadata-action's procSemver, not assumed:
      #   v0.3.0       -> 0.3.0, 0.3, sha-<7>, and `latest` (flavor latest=auto)
      #   v0.3.0-rc.1  -> 0.3.0-rc.1 and sha-<7> only. A pre-release falls back
      #                   to {{version}} for every pattern and never sets latest.
      # `type=ref,event=branch` is empty on any tag, so no tag moves `main`.
      # Nothing here pulls `latest` (compose defaults to `main`), but a
      # candidate must not move it for whoever does.
      - name: Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build + push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          # Build everywhere, publish only from the branches that something
          # actually pulls. On a pull request the image is built and discarded:
          # the point there is to prove the Dockerfile still works.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NODE_VERSION=${{ steps.node.outputs.version }}-alpine
            AGENT_VERSION=${{ steps.agent.outputs.version }}
          # Cache via GHA cache (free, ephemeral), speeds up incremental
          # builds dramatically without needing a paid registry tier.
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,scope=${{ matrix.image.name }},mode=max

      - name: Summary
        if: always()
        run: |
          {
            echo "### docker: ${{ matrix.image.name }}"
            echo ""
            if [ "${{ github.event_name }}" != "pull_request" ]; then
              echo "published:"
            else
              echo "built and discarded (pull request), tags it would have carried:"
            fi
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "- node ${{ steps.node.outputs.version }}-alpine, from \`.nvmrc\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # I7 (Trivy image scan) intentionally deferred: a pinned trivy-action
      # version must be verified against a live run (a bad ref fails the whole
      # docker job at action-resolution), and the scan should land report-only
      # first so an unpatched base CVE doesn't wedge every deploy. Add it as a
      # separate, watched change once the baseline is known clean.

  # ───────────────────────────────────────────────────────────────────────
  # Secrets. The repository is PUBLIC, so a leaked node key or JWT secret is
  # not "fix it in the next commit": it is already in the history and in every
  # clone. Cheap to run, and the one check whose absence is unrecoverable.
  # ───────────────────────────────────────────────────────────────────────
  secrets-scan:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # For the SARIF upload below.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a secret committed and "removed" a few commits later
          # is still there, and scanning only the tip would call that clean.
          fetch-depth: 0

      # The tool itself, not gitleaks/gitleaks-action: that wrapper requires a
      # paid licence for repositories owned by an ORGANISATION, and ours is.
      # gitleaks is free either way, so the licence buys the action's reporting
      # niceties - not the scanning we actually want.
      #
      # --redact so a finding does not print the secret into a public build log,
      # which would leak it a second time to a wider audience.
      #
      # ⚠ Pinned by version AND digest. This image is handed the whole history
      # of a public repository, so `:latest` was the one place where whatever
      # the registry served that day ran over everything we ever committed.
      # Dependabot does not update a `docker run` line, so a bump is by hand:
      # take the newest release from github.com/gitleaks/gitleaks/releases,
      # read its index digest with
      #   docker buildx imagetools inspect zricethezav/gitleaks:vX.Y.Z
      # (the "Digest:" line, the index, not one platform's manifest), put both
      # here, and check this job still reports the same findings as before.
      #
      # --log-opts: the history of the commit under test, not of every branch.
      # Without it gitleaks reads `git log --all`, and the checkout above
      # fetches every branch, so a run judged each branch by the
      # .gitleaks.toml of the commit it happened to test: on 25.10 main,
      # with its own older allowlist, went red on two develop commits it did
      # not contain. The commit's own history is what it ships: for a pull
      # request github.sha is the merge commit, the PR and its base together.
      # --full-history keeps every merged branch's commits in that history.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source=/repo --config=/repo/.gitleaks.toml \
            --log-opts="--full-history ${GITHUB_SHA}" \
            --redact --verbose --no-banner \
            --report-format sarif --report-path /repo/gitleaks.sarif

      # Findings belong in Security -> Code scanning, where they are a list
      # somebody can work through, rather than in a log line at the bottom of a
      # red job. `always()` because the interesting case is the failing one, and
      # the report stays redacted: this repository is public.
      - name: Upload findings
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

      - name: Summary
        if: always()
        run: |
          {
            echo "### secrets"
            echo ""
            if [ -f gitleaks.sarif ]; then
              echo "- findings: $(jq '[.runs[].results[]] | length' gitleaks.sarif) (redacted, full list in Security -> Code scanning)"
            else
              echo "- the scan produced no report, so it did not get as far as scanning"
            fi
            echo "- the whole history is scanned, because a secret removed three commits later is still there"
            echo "- fixtures are allowed by VALUE in \`.gitleaks.toml\`, never by directory"
          } >> "$GITHUB_STEP_SUMMARY"

  # ───────────────────────────────────────────────────────────────────────
  # Go static analysis. `go vet` in the node-agent job is the bare minimum;
  # this agent runs on other people's machines and holds their traffic, so
  # data races and leaked resources cost more here than in the panel. Newly
  # relevant after the memory watchdog added a goroutine and more locking.
  # ───────────────────────────────────────────────────────────────────────
  go-lint:
    name: go lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.node == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache-dependency-path: apps/node/go.sum
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # The linter itself, pinned: `latest` changed the rule set under a
          # commit that changed nothing. Dependabot moves the action above, not
          # this. A bump is by hand: the newest release from
          # github.com/golangci/golangci-lint/releases, then compare the issue
          # count in this job's log ("N issues:") with the run before it; the
          # action logs the version it installed ("Installing golangci-lint
          # binary vX.Y.Z").
          version: v2.15.0
          working-directory: apps/node
          # Report-only for now: turning a fresh linter loose on existing code
          # usually produces a wall of findings, and a red pipeline nobody can
          # green is a pipeline people learn to ignore. Flip this off once the
          # baseline is clean.
          args: --timeout=5m --issues-exit-code=0

      - name: Summary
        if: always()
        run: |
          {
            echo "### go lint"
            echo ""
            echo "- golangci-lint, report-only (\`--issues-exit-code=0\`): findings are in the log, not in the verdict"
            echo "- it still gates the image build, so the day it starts failing it stops a publish"
          } >> "$GITHUB_STEP_SUMMARY"

  # ───────────────────────────────────────────────────────────────────────
  # Smoke: does the BUILT IMAGE actually come up?
  #
  # The suite exercises source; the image is a different execution path with
  # its own install, its own module resolution and its own entrypoint. That
  # gap bit us in production once already, when @iceslab/shared failed to
  # resolve inside the container while every test and build was green.
  # ───────────────────────────────────────────────────────────────────────
  #
  # ⚠ On a push (or a manual run) this pulls the PUBLISHED image by its sha tag instead of
  # building its own. Building a second time proved the Dockerfile works, which
  # is not the question: the question is whether the artifact the test server
  # will pull boots, and a local rebuild can differ from the published one for
  # any of the reasons builds ever differ. On a pull request nothing is
  # published, so there the local build stays and the summary says so.
  smoke:
    name: smoke (image boots)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [docker]
    if: "!cancelled() && needs.docker.result == 'success'"
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ice
          POSTGRES_PASSWORD: ice
          POSTGRES_DB: iceslab_smoke
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: github.event_name == 'pull_request'

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The published artifact, by the same sha tag the docker job wrote.
      - name: Pull the published image
        id: image
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          ref="ghcr.io/${{ github.repository_owner }}/iceslab-backend:sha-$(echo "${{ github.sha }}" | cut -c1-7)"
          docker pull "$ref"
          docker tag "$ref" iceslab-backend:smoke
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      # No publish on a pull request, so there is nothing to pull: build it here
      # and be explicit that this proves the Dockerfile, not a deployable
      # artifact.
      - name: Build backend image (pull request only)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/panel-backend/Dockerfile
          push: false
          load: true
          tags: iceslab-backend:smoke
          cache-from: type=gha,scope=iceslab-backend

      - name: Migrate and boot
        run: |
          set -euo pipefail
          DB='postgres://ice:ice@172.17.0.1:5432/iceslab_smoke'
          # Migrations run from the image too: a migration that only applies
          # from a developer checkout is not a migration that ships.
          docker run --rm --network host -e DATABASE_URL="$DB" \
            --entrypoint sh iceslab-backend:smoke \
            -c 'cd /app/apps/panel-backend && pnpm exec prisma migrate deploy'
          docker run -d --name smoke --network host \
            -e DATABASE_URL="$DB" \
            -e REDIS_URL='redis://172.17.0.1:6379/0' \
            -e JWT_SECRET='ci-smoke-secret-must-be-at-least-32-chars' \
            -e PUBLIC_URL='https://panel.smoke.test' \
            -e NODE_ENV='production' \
            iceslab-backend:smoke

      - name: Wait for /health
        id: health
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health >/dev/null; then
              echo "panel answered after ${i}s"
              echo "seconds=${i}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 1
          done
          echo "panel never answered on /health"
          docker logs smoke || true
          exit 1

      - name: Container logs on failure
        if: failure()
        run: docker logs smoke || true

      - name: Summary
        if: always()
        run: |
          {
            echo "### smoke (image boots)"
            echo ""
            if [ "${{ github.event_name }}" != "pull_request" ]; then
              echo "- ran the PUBLISHED image: \`${{ steps.image.outputs.ref }}\`"
            else
              echo "- pull request: nothing is published, so the image was built here"
            fi
            echo "- migrations applied from inside the image, then \`/health\` answered after ${{ steps.health.outputs.seconds || '-' }}s"
          } >> "$GITHUB_STEP_SUMMARY"

  # ───────────────────────────────────────────────────────────────────────
  # Does the FRONTEND image send subscriptions to the backend at the prefix
  # the operator set?
  #
  # A-137, 2026-10-22: the backend read SUBSCRIPTION_PATH_PREFIX, the
  # frontend's nginx proxied a hard-coded /sub/, and with any other prefix
  # every subscription came back as the SPA's index.html with a 200. Nothing
  # failed, the clients just got HTML. The image now renders its config from
  # the variable at start; this job runs it the way an operator would and
  # asks a stand-in backend what reached it.
  #
  # Same rule as smoke: the published image on a push, a local build on a
  # pull request.
  # ───────────────────────────────────────────────────────────────────────
  frontend-proxy:
    name: smoke (frontend proxies the subscription prefix)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [docker]
    if: "!cancelled() && needs.docker.result == 'success'"
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: github.event_name == 'pull_request'

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the published image
        id: image
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          ref="ghcr.io/${{ github.repository_owner }}/iceslab-frontend:sha-$(echo "${{ github.sha }}" | cut -c1-7)"
          docker pull "$ref"
          docker tag "$ref" iceslab-frontend:proxy
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Build frontend image (pull request only)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/panel-frontend/Dockerfile
          push: false
          load: true
          tags: iceslab-frontend:proxy
          cache-from: type=gha,scope=iceslab-frontend

      # The stand-in answers every request with the path it received, so the
      # check reads where a request went, not just that something answered.
      - name: Stand-in backend
        run: |
          set -euo pipefail
          docker network create proxy-net
          docker run -d --name backend --network proxy-net --network-alias backend \
            node:22-alpine node -e \
            "require('http').createServer((q,s)=>s.end('BACKEND '+q.url)).listen(3000)"

      - name: Subscription prefix /s2, and the default
        run: |
          set -euo pipefail
          start() {
            local name="$1" port="$2"; shift 2
            docker run -d --name "$name" --network proxy-net -p "127.0.0.1:${port}:80" "$@" iceslab-frontend:proxy
            for i in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:${port}/" >/dev/null 2>&1; then return 0; fi
              sleep 1
            done
            docker logs "$name"
            echo "::error::$name did not answer on :$port"
            exit 1
          }
          # `[[ == ]]` on a variable, not `| grep -q` (E33).
          expect_backend() {
            local body
            body=$(curl -fsS "$1")
            if [[ "$body" != "BACKEND $2" ]]; then
              echo "::error::$1 should reach the backend as $2, got: ${body:0:120}"
              exit 1
            fi
            echo "ok: $1 -> backend $2"
          }
          expect_spa() {
            local body
            body=$(curl -fsS "$1")
            if [[ "$body" == BACKEND* || "$body" != *'<div id="root">'* ]]; then
              echo "::error::$1 should be the SPA, got: ${body:0:120}"
              exit 1
            fi
            echo "ok: $1 -> SPA index.html"
          }

          start fe-s2 8081 -e SUBSCRIPTION_PATH_PREFIX=/s2
          expect_backend http://127.0.0.1:8081/s2/tok-123 /s2/tok-123
          expect_spa http://127.0.0.1:8081/sub/tok-123
          expect_backend http://127.0.0.1:8081/api/auth/status /api/auth/status

          # No variable: the image's default, as before the change.
          start fe-default 8082
          expect_backend http://127.0.0.1:8082/sub/tok-123 /sub/tok-123
          expect_spa http://127.0.0.1:8082/s2/tok-123

      # A value the backend would refuse stops the container with a reason,
      # instead of reaching a location line.
      - name: A prefix the backend would refuse is refused here too
        run: |
          set -euo pipefail
          for bad in '/s2;x' 'sub' '/api'; do
            if docker run --rm --network proxy-net -e "SUBSCRIPTION_PATH_PREFIX=$bad" \
                 iceslab-frontend:proxy nginx -t >/tmp/bad.log 2>&1; then
              cat /tmp/bad.log
              echo "::error::SUBSCRIPTION_PATH_PREFIX=$bad was accepted"
              exit 1
            fi
            out=$(cat /tmp/bad.log)
            if [[ "$out" != *"iceslab-frontend: SUBSCRIPTION_PATH_PREFIX=\"$bad\""* ]]; then
              echo "$out"
              echo "::error::$bad was refused, but not by the prefix check"
              exit 1
            fi
            echo "ok: $bad refused"
          done

      - name: Container logs on failure
        if: failure()
        run: |
          for c in fe-s2 fe-default backend; do echo "== $c"; docker logs "$c" 2>&1 | tail -40 || true; done

      - name: Summary
        if: always()
        run: |
          {
            echo "### smoke (frontend proxies the subscription prefix)"
            echo ""
            if [ "${{ github.event_name }}" != "pull_request" ]; then
              echo "- ran the PUBLISHED image: \`${{ steps.image.outputs.ref }}\`"
            else
              echo "- pull request: nothing is published, so the image was built here"
            fi
            echo "- SUBSCRIPTION_PATH_PREFIX=/s2: /s2/<token> reaches the backend, /sub/<token> is the SPA"
            echo "- unset: /sub/<token> reaches the backend, as before"
            echo "- /s2;x, sub and /api: the container refuses to start"
          } >> "$GITHUB_STEP_SUMMARY"

  # ───────────────────────────────────────────────────────────────────────
  # One check to protect the branch with.
  #
  # Branch protection reads the checks list, and a SKIPPED job is green there.
  # With path filters that is most of the list on most commits, so "all checks
  # passed" stopped meaning anything the moment filters landed. This job is the
  # one thing that knows the difference between the two kinds of skip:
  #
  #   - skipped because this commit did not touch that area, which is the point
  #     of the filter and is fine;
  #   - skipped because something it needed failed or was cancelled, which is a
  #     failure wearing a grey tick.
  #
  # So it takes the filter OUTPUTS as well as the results and reads them
  # together. Protect `develop` and `main` with THIS check and nothing else.
  # ───────────────────────────────────────────────────────────────────────
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      [changes, audit, secrets-scan, backend, backend-files, frontend, node-agent, go-lint, docker, smoke, frontend-proxy]
    steps:
      - name: Every check accounted for
        env:
          RESULTS: ${{ toJSON(needs) }}
          RUNS_BACKEND: ${{ needs.changes.outputs.backend }}
          RUNS_FRONTEND: ${{ needs.changes.outputs.frontend }}
          RUNS_NODE: ${{ needs.changes.outputs.node }}
          EVENT: ${{ github.event_name }}
          SAME_REPO: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          verdict=0
          rows=""

          # $1 job, $2 "yes"/"no": may this job legitimately be skipped?
          check() {
            local job="$1" may_skip="$2"
            local result ok="no"
            result=$(jq -r --arg j "$job" '.[$j].result // "missing"' <<<"$RESULTS")
            case "$result" in
              success) ok="yes" ;;
              skipped) [ "$may_skip" = "yes" ] && ok="yes" ;;
            esac
            [ "$ok" = "yes" ] || verdict=1
            rows="${rows}| ${job} | ${result} | ${ok} |"$'\n'
          }

          # Never filtered, never optional.
          check changes no
          check audit no
          check secrets-scan no

          # Filtered by area. A skip is legitimate exactly when the filter said
          # the area was untouched, which is why the outputs are read here
          # instead of assumed.
          # A matrix job reports one result for all its parts: failure if any
          # part failed. backend-files is what says no file fell between them.
          check backend "$([ "$RUNS_BACKEND" = "true" ] && echo no || echo yes)"
          check backend-files "$([ "$RUNS_BACKEND" = "true" ] && echo no || echo yes)"
          check frontend "$([ "$RUNS_FRONTEND" = "true" ] && echo no || echo yes)"
          check node-agent "$([ "$RUNS_NODE" = "true" ] && echo no || echo yes)"
          check go-lint "$([ "$RUNS_NODE" = "true" ] && echo no || echo yes)"

          # docker builds on a same-repo pull request and on the branches that
          # something pulls. A fork PR gets no image build at all, by design, so
          # there its skip is the expected answer.
          docker_may_skip=yes
          if [ "$EVENT" = "push" ]; then
            case "$REF" in
              refs/heads/main|refs/heads/develop|refs/tags/v*) docker_may_skip=no ;;
            esac
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            case "$REF" in
              refs/heads/main|refs/heads/develop) docker_may_skip=no ;;
            esac
          elif [ "$EVENT" = "pull_request" ] && [ "$SAME_REPO" = "true" ]; then
            docker_may_skip=no
          fi
          check docker "$docker_may_skip"
          # Smoke follows docker: no image, nothing to boot.
          check smoke "$docker_may_skip"
          check frontend-proxy "$docker_may_skip"

          {
            echo "### gate"
            echo ""
            echo "| check | result | accepted |"
            echo "| --- | --- | --- |"
            printf '%s' "$rows"
            echo ""
            if [ "$verdict" = 0 ]; then
              echo "Every check either passed or was skipped for a reason this job can name."
            else
              echo "**A check did not pass, or was skipped without the filter asking for it.**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$verdict"
