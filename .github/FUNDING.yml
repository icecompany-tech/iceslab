# Funding sources shown in the "Sponsor" button on the GitHub repo page.
# Docs: https://docs.github.com/en/repositories/managing-your-repositorys-settings-and-features/customizing-your-repository/displaying-a-sponsor-button-in-your-repository
#
# GitHub accepts only its own keys here and, under `custom`, up to four URLs.
# A wallet address is not a URL, so the address itself lives in the README
# (section "Support the project"), and the button points at that section.
#
# GitHub Sponsors is not available for this account's region without a fiscal
# host, so the `github:` key stays out until that changes. Other platforms are
# added only when an account really exists behind them: an empty handle turns
# the button into a 404.

custom:
  - https://github.com/icecompany-tech/iceslab#support-the-project
