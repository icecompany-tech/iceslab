version: 2

# Why this exists: version drift here is invisible until it breaks something.
# GitHub Actions announced the Node 20 runtime as deprecated and our workflow
# started warning in every job; the three high-severity advisories the audit
# gate caught on 2026-08-08 had been sitting in the lockfile for a while. Both
# are the same failure mode - nobody re-reads dependency versions on a schedule.
#
# Monthly rather than weekly, grouped rather than one PR per package, and no
# major bumps at all. The first run proved the point: four majors arrived at
# once, three of them red, on top of the two grouped PRs that were green. A
# flood gets ignored wholesale, which is worse than none at all.
#
# Skipping majors is safe HERE specifically because CI already runs
# `pnpm audit --audit-level high` and fails on it, so a real advisory stops the
# build whether or not a bot opened a PR for it. What is left for this file is
# routine drift, and drift does not need a major version bump: those are a
# deliberate decision (a typescript or i18n major changes how we write code),
# taken when we choose to, not when a bot notices.
#
# Since 2026-09-26 a green minor or patch PR merges ITSELF into develop
# (workflows/dependabot-automerge.yml); nobody reviews a bot's diff by hand.
# That is acceptable here and not in general, for three reasons that are all
# in CI rather than in anybody's attention: majors never reach that path (they
# are ignored above, and a group carrying one is left for a person); the audit
# gate fails the build on a high advisory; and the backend suite runs against
# the pinned xray, sing-box and hysteria binaries, live legs included, so a
# library that breaks what the cores are handed breaks the build, not a node.
# The one thing CI cannot see is a release that is itself the attack, which is
# what the week of cooldown below is for: a version is taken only after it
# has been public for seven days, long enough for a compromised one to be
# noticed and yanked by somebody else.
#
# ⚠ EVERY ecosystem targets `develop`, and leaving it out is not a small
# difference: dependabot opens against the default branch, which is `main`, the
# branch installers pull from. A dependency bump would then arrive straight at
# the release branch, be merged there on green, and sit ahead of develop until
# somebody noticed the two had diverged. Work lands on develop here and reaches
# main as a release, bots included.
updates:
  # The workflow actions themselves. Cheapest to keep current and the most
  # likely to break loudly, since a removed runtime fails every job at once.
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
    open-pull-requests-limit: 1
    commit-message:
      prefix: ci

  # The pnpm workspace. One grouped PR of patch and minor updates, usually safe
  # to merge on green CI. Majors are ignored on purpose, see the header.
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore

  # The node-agent. Its dependency surface is deliberately small, so this is
  # quiet - which is exactly why it would otherwise be forgotten.
  - package-ecosystem: gomod
    directory: /apps/node
    target-branch: develop
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      go:
        patterns: ['*']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore
